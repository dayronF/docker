services:
  backend:
    build:
      context: ${BACKEND_PATH:-../Syncra}
    env_file:
      - ${BACKEND_PATH:-../Syncra}/.env
    expose:
      - "8080"
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/public/stats"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai-service:
    build:
      context: ${AI_SERVICE_PATH:-../ai-service}
    env_file:
      - ${AI_SERVICE_PATH:-../ai-service}/.env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
 
  frontend:
    build:
      context: ${FRONTEND_PATH:-../Syncra_front}
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
 
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
 