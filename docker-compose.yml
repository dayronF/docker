services:
  backend:
    build:
      context: ${BACKEND_PATH:-../Syncra}
    env_file:
      - ${BACKEND_PATH:-../Syncra}/.env
    expose:
      - "8080"
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/public/stats"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai-service:
    build:
      context: ${AI_SERVICE_PATH:-../ai-service}
    env_file:
      - ${AI_SERVICE_PATH:-../ai-service}/.env
    environment:
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_TIMEOUT_SECONDS: "120"
      OPENROUTER_MAX_OUTPUT_TOKENS: "0"
      OPENROUTER_HTTP_REFERER: http://localhost:8000
      OPENROUTER_APP_TITLE: Syncra AI`
      OPENROUTER_MODEL_SECONDARY: nvidia/nemotron-3-super-120b-a12b:free
      OPENROUTER_MODEL_FALLBACK: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      OPENROUTER_REASONING_EFFORT: low
      APP_ENV: development
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
 
  frontend:
    build:
      context: ${FRONTEND_PATH:-../Syncra_front}
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
 
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
 