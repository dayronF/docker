services:
  backend:
    build:
      context: ${BACKEND_PATH:-../Syncra}
    env_file:
      - ${BACKEND_PATH:-../Syncra}/.env
    expose:
      - "8080"
 
  frontend:
    build:
      context: ${FRONTEND_PATH:-../Syncra_front}
    expose:
      - "80"
 
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
 