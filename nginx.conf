server {
    listen 80;
 
    # El backend usa context-path: /api/v1/ (ver application.yml)
    # Sin "/" al final en proxy_pass => nginx reenvía el path COMPLETO tal cual,
    # así que /api/v1/lo-que-sea llega intacto a backend:8080/api/v1/lo-que-sea
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
 
    # Todo lo demás va al frontend (Angular servido por su propio nginx interno)
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
    }
}
 