services:
  backend:
    build:
      context: ${BACKEND_PATH:-../Syncra}
      dockerfile: Dockerfile.dev
    env_file:
      - ${BACKEND_PATH:-../Syncra}/.env
    volumes:
      - ${BACKEND_PATH:-../Syncra}:/app
      - backend_m2:/root/.m2
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ${FRONTEND_PATH:-../Syncra_front}
      dockerfile: Dockerfile.dev
    volumes:
      - ${FRONTEND_PATH:-../Syncra_front}:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "4200:4200"
    command: sh -c "npx ng serve --host 0.0.0.0 --port 4200 --poll 1000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  backend_m2: