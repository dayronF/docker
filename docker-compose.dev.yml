services:
  backend:
    build:
      context: ${BACKEND_PATH:-../Syncra}
      dockerfile: Dockerfile.dev
    env_file:
      - ${BACKEND_PATH:-../Syncra}/.env
    volumes:
      - ${BACKEND_PATH:-../Syncra}:/app
      - backend_m2:/root/.m2
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/public/stats"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      AI_SERVICE_URL: http://ai-service:8000

  ai-service:
    build:
      context: ${AI_SERVICE_PATH:-../ai-service}
    env_file:
      - ${AI_SERVICE_PATH:-../ai-service}/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ${FRONTEND_PATH:-../Syncra_front}
      dockerfile: Dockerfile.dev
    volumes:
      - ${FRONTEND_PATH:-../Syncra_front}:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "4200:4200"
    command: sh -c "npx ng serve --host 0.0.0.0 --port 4200 --poll 1000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4200/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  backend_m2: